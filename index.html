<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>پژوهش زیبایی‌شناسی ارتودنسی</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinch-zoom-element-js@1.1.2/dist/pinch-zoom.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/pinch-zoom-element-js@1.1.2/lib/styles.min.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        bgDark: '#F8FAFC',
                        bgCard: '#1E293B',
                        primary: '#3B82F6',
                        primaryHover: '#60A5FA',
                        secondary: '#22D3EE',
                        textMain: '#0F172A',
                        textMuted: '#64748B'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --color-primary: #3B82F6;
            --color-primary-hover: #60A5FA;
        }

        body {
            background-color: #0F172A;
            color: #F8FAFC;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
        }

        /* Remove flex/alignment issues */
        pinch-zoom {
            display: block;
            position: relative;
            width: 100%;
            height: 260px;
            overflow: hidden;
            border-radius: 0.75rem;
            /* Allow the browser to handle normal mouse scrolling outside the image */
            /* touch-action: pan-y;  */
            touch-action: none;
            /* <-- Change this to 'none' */
            /* This ensures the library doesn't capture the mouse unless it's a specific gesture */
            user-select: none;
        }

        #auto-zoom-image {
            /* Use a stable origin so the browser doesn't have to re-anchor the element */
            transform-origin: top center;
            /* Single transition for both scale and translation */
            transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        /* Ensure the image container sits flush at the top */
        .image-container-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }


        pinch-zoom img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .step {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease-out;
        }

        .step.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            /* 1. Create a massive invisible touch zone (double the original size) */
            height: 80px;
            background: transparent;
            outline: none;
            /* 2. Pull the margins negative so this huge hit area doesn't break your visual layout */
            margin-top: -20px;
            margin-bottom: -20px;
            cursor: pointer;
            /* 3. Prevent the ugly grey/blue tap highlight box on Android */
            -webkit-tap-highlight-color: transparent;
        }

        /* Leave your track and thumb CSS exactly as they are! */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 99px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            margin-top: -8px;
            transition: transform 0.1s ease;
            border: 2px solid #F8FAFC;
        }

        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
            background: var(--color-primary);
        }

        input[type=range]::-webkit-slider-thumb:hover {
            background: var(--color-primary-hover);
            transform: scale(1.1);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-start sm:justify-center p-4 sm:p-6 pb-32">

    <button id="fab-photos" onclick="togglePhotosModal()"
        class="fixed bottom-6 left-6 z-40 bg-primary text-white px-5 py-4 rounded-2xl active:scale-95 transition-all duration-200 hidden flex-row items-center justify-center gap-3 shadow-lg shadow-black/20">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
            </path>
        </svg>
        <span class="font-bold text-sm">مشاهده تصاویر</span>
    </button>

    <div id="photos-modal"
        class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex-col justify-end transition-opacity duration-300 opacity-0"
        onclick="handleOutsideClick(event)">
        <div id="photos-modal-content"
            class="absolute bg-bgCard w-full max-w-lg mx-auto rounded-t-3xl sm:rounded-3xl p-6 pb-0 h-[85vh] sm:h-[auto] sm:max-h-[90vh] flex flex-col transform translate-y-full bottom-0 transition-transform duration-300">

            <div class="flex justify-between items-center mb-6 shrink-0">
                <h3 class="text-xl font-bold text-white">تصاویر مرجع</h3>
                <button onclick="togglePhotosModal()"
                    class="bg-slate-700 text-white p-2 rounded-full active:bg-slate-600 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <div class="overflow-y-auto no-scrollbar space-y-8 pb-10">
                <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
                    <span class="text-primary font-bold text-sm mb-3 block">تصویر الف: الاینر شفاف</span>
                    <div class="h-[260px] bg-black/30 rounded-xl overflow-hidden border border-slate-700/50">
                        <pinch-zoom disable-pan="true" animating="true">
                            <img src="p-clear-aligner-1.png" alt="الاینر شفاف">
                        </pinch-zoom>
                    </div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
                    <span class="text-secondary font-bold text-sm mb-3 block">تصویر ب: براکت سرامیکی</span>
                    <div class="h-[260px]  bg-black/30 rounded-xl overflow-hidden border border-slate-700/50">
                        <pinch-zoom disable-pan="true" animating="true">
                            <img src="p-ceramic-brackets-1.png" alt="براکت سرامیکی">
                        </pinch-zoom>
                    </div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
                    <span class="text-purple-400 font-bold text-sm mb-3 block">تصویر ج: براکت فلزی</span>
                    <div class="h-[260px] bg-black/30 rounded-xl overflow-hidden border border-slate-700/50">
                        <pinch-zoom disable-pan="true" animating="true">
                            <img src="p-metallic-brackets-1.png" alt="براکت فلزی">
                        </pinch-zoom>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div
        class="w-full max-w-md bg-bgCard rounded-[0.5rem] shadow-xl border border-slate-700/50 relative z-10 mt-4 sm:mt-0">
        <div class="h-1.5 w-full bg-slate-800 rounded-t-[0.5rem] overflow-hidden">
            <div id="progress-bar" class="h-full bg-primary transition-all duration-500 ease-out" style="width: 0%;">
            </div>
        </div>
        <div id="survey-container" class="p-6 sm:p-8"></div>
    </div>

    <script>
        let surveyData = {};
        let currentStep = -1;
        let responses = {};
        let questionObserver = null;

        async function loadSurvey() {
            try {
                // Using dummy data for demonstration if API fails
                const res = await fetch('https://engine.dentnet.space/api/appliance_survey/config');
                surveyData = await res.json();
                renderIntro();
            } catch (err) {
                document.getElementById('survey-container').innerHTML = `<p class="text-red-400 text-center text-sm">خطا در بارگذاری اطلاعات. لطفا از اجرای سرور محلی اطمینان حاصل کنید.</p>`;
            }
        }

        function renderIntro() {
            const html = `
                <div id="step--1" class="step active text-center">
                    <h1 class="text-2xl sm:text-3xl font-black text-white mb-4 leading-tight">${surveyData.title || 'ارزیابی'}</h1>
                    <p class="text-textMuted text-sm mb-10 leading-relaxed">${surveyData.intro_text || 'متن خوش‌آمدگویی'}</p>
                    <button onclick="changeStep(0)" class="w-full bg-primary text-white font-bold py-4 rounded-xl active:bg-primaryHover active:scale-[0.98] transition-all text-lg">شروع ارزیابی</button>
                </div>
            `;
            document.getElementById('survey-container').innerHTML = html;
        }

        function renderQuestions(questions) {
            return questions.map((q, index) => {
                // Determine zoom state from JSON, fallback to a cycle for demonstration
                const zoomState = q.zoom || ['far', 'near', 'closeup'][index % 3];

                let questionContent = '';

                if (q.type === 'radio') {
                    const opts = q.options.map(opt => `
                        <label class="block cursor-pointer">
                            <input type="radio" name="${q.id}" value="${opt.val}" class="peer sr-only" onchange="saveResponse('${q.id}', this.value)">
                            <div class="rounded-xl border border-slate-600 bg-slate-800/50 p-4 text-center text-sm font-medium text-textMuted transition-all duration-200 peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary active:scale-95 flex items-center justify-center min-h-[56px]">${opt.text}</div>
                        </label>
                    `).join('');
                    questionContent = `
                        <label class="block text-sm font-medium text-white mb-4 leading-relaxed">${q.label}</label>
                        <div class="grid grid-cols-2 gap-3">${opts}</div>`;
                }

                if (q.type === 'slider') {
                    const min = parseFloat(q.min);
                    const max = parseFloat(q.max);
                    const midVal = Math.ceil((max - min) / 2) + min;

                    if (!responses.hasOwnProperty(q.id)) {
                        responses[q.id] = midVal;
                    }
                    const currentVal = responses[q.id];
                    const percent = ((currentVal - min) / (max - min)) * 95 + 2;

                    questionContent = `
                        <label class="block text-sm font-medium text-white mb-10 leading-relaxed text-center">${q.label}</label>
                        <div class="relative pt-2 pb-2" dir="ltr">
                            <div id="bubble_${q.id}" class="absolute -top-8 w-9 h-9 -ml-[16px] bg-primary flex items-center justify-center rounded-xl rotate-45 transition-all duration-75 ease-out z-10" style="left: ${percent}%;">
                                <span class="-rotate-45 font-bold text-white text-sm mt-0.5 ml-0.5">${currentVal}</span>
                            </div>
                            <input type="range" id="${q.id}" min="${q.min}" max="${q.max}" value="${currentVal}" class="w-full relative z-20" oninput="updateSliderBubble(this, '${q.id}'); saveResponse('${q.id}', this.value)">
                        </div>
                        <div class="flex justify-between text-xs mt-4 font-medium px-1 text-textMuted" dir="ltr">
                            <span class="text-left w-1/2">${q.left_label}</span>
                            <span class="text-right w-1/2">${q.right_label}</span>
                        </div>`;
                }

                // Wrap EVERY question in an observer block
                return `
                    <div class="question-block mb-5 p-5 rounded-2xl bg-slate-800/50 border border-slate-700" data-zoom="${zoomState}">
                        ${questionContent}
                    </div>`;
            }).join('');
        }

        function renderStepContent(stepIndex) {
            const step = surveyData.steps[stepIndex];
            const isLast = stepIndex === surveyData.steps.length - 1;

            // ISOLATED INNER WRAPPER STRATEGY
            let imageHtml = step.image ? `
            <div class="h-[260px] sticky top-2 sm:top-4 z-30 mb-8 relative rounded-2xl border border-slate-700 bg-slate-800 overflow-hidden shadow-[0_10px_40px_-10px_rgba(0,0,0,0.6)]">
                <pinch-zoom disable-pan="true" animating="true">
                    <div class="image-container-wrapper">
                        <img id="auto-zoom-image" src="${step.image}" alt="Step Image" 
                            class="w-full h-full object-contain"
                            style="transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform; transform: scale(1); transform-origin: center center;">
                    </div>
                </pinch-zoom>
            </div>` : '';

            let btnHtml = `
                <div class="mt-8 flex gap-3">
                    <button onclick="changeStep(${stepIndex - 1})" class="w-1/3 bg-slate-700 text-white font-medium py-3.5 rounded-xl active:bg-slate-600 transition-colors text-sm">بازگشت</button>
                    ${isLast
                    ? `<button onclick="submitData()" class="w-2/3 bg-primary text-white font-bold py-3.5 rounded-xl active:bg-primaryHover transition-colors text-sm">پایان و ثبت</button>`
                    : `<button onclick="validateAndNext(${stepIndex})" class="w-2/3 bg-primary text-white font-bold py-3.5 rounded-xl active:bg-primaryHover transition-colors text-sm">ادامه</button>`
                }
                </div>`;

            let stepIntroHtml = step.intro ? `<p class="text-textMuted text-sm mb-6 leading-relaxed bg-slate-800/80 p-4 rounded-xl border border-slate-700">${step.intro}</p>` : '';

            return `
                <div id="step-content-${stepIndex}" class="step active">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold text-white">${step.title}</h3>
                    </div>
                    ${imageHtml}
                    <div class="space-y-4 pt-2">${renderQuestions(step.questions)}</div>
                    ${btnHtml}
                </div>`;
        }

        // --- Intersection Observer Logic ---
        // The scroll listener that creates the "smooth scrub" effect
        let scrollTimeout;
        window.addEventListener('scroll', () => {
            // Debounce: Only update zoom when user stops scrolling for 50ms
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const blocks = document.querySelectorAll('.question-block');
                blocks.forEach(block => {
                    const rect = block.getBoundingClientRect();
                    // Check if the block is in the "active zone" (middle of screen)
                    if (rect.top < window.innerHeight * 0.6 && rect.bottom > window.innerHeight * 0.4) {
                        applyAutoZoom(block.getAttribute('data-zoom'));
                    }
                });
            }, 50);
        }, { passive: true });

        // Keep only this one:
        function applyAutoZoom(level) {
            const img = document.getElementById('auto-zoom-image');
            if (!img) return;

            let scale = 1;
            let yOffset = 0; // Moves the image up/down to center teeth

            if (level === 'far') {
                scale = 1;
                yOffset = 0;
            } else if (level === 'near') {
                scale = 1.6;
                yOffset = 0; // Shifts up to center the mouth area
            } else if (level === 'closeup') {
                scale = 3.9;
                yOffset = -15; // Shifts further up to center the teeth
            }

            // Apply both in one single transform string for perfect motion
            img.style.transform = `scale(${scale}) translateY(${yOffset}%)`;
        }
        // --- Interactive Logic ---
        function saveResponse(key, val) { responses[key] = val; }

        function updateSliderBubble(slider, qId) {
            const val = slider.value;
            const min = parseFloat(slider.min);
            const max = parseFloat(slider.max);
            const raw = ((val - min) / (max - min)) * 95 + 3;
            const percent = Math.max(0, raw < 5 ? 0 : raw);
            const bubble = document.getElementById('bubble_' + qId);
            if (bubble) {
                bubble.style.left = `calc(${percent}% + (${8 - percent * 0.15}px))`;
                const textSpan = bubble.firstElementChild;
                if (textSpan) textSpan.innerText = val;
            }
        }

        function togglePhotosModal() {
            const modal = document.getElementById('photos-modal');
            const content = document.getElementById('photos-modal-content');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    content.classList.remove('translate-y-full');
                    if (window.innerWidth < 640) document.body.style.overflow = 'hidden';
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                content.classList.add('translate-y-full');
                document.body.style.overflow = '';
                setTimeout(() => { modal.classList.add('hidden'); }, 300);
            }
        }

        function handleOutsideClick(event) {
            if (event.target.id === 'photos-modal') togglePhotosModal();
        }

        function validateAndNext(stepIndex) {
            const step = surveyData.steps[stepIndex];
            for (let q of step.questions) {
                if (q.type === 'radio' && !responses[q.id]) {
                    alert('لطفاً پیش از ادامه، به تمامی سوالات این بخش پاسخ دهید.');
                    return;
                }
            }
            changeStep(stepIndex + 1);
        }



        function changeStep(targetIndex) {
            const container = document.getElementById('survey-container');
            const firstChild = container.firstElementChild;

            if (firstChild) {
                firstChild.style.opacity = '0';
                firstChild.style.transform = 'translateY(-10px)';
            }

            setTimeout(() => {
                if (targetIndex === -1) {
                    renderIntro();
                } else if (targetIndex >= surveyData.steps.length) {
                    renderSuccess();
                } else {
                    container.innerHTML = renderStepContent(targetIndex);

                    // INITIALIZE OBSERVER ONCE CONTENT IS RENDERED
                    // setupIntersectionObserver();
                }

                if (targetIndex >= 0 && targetIndex < surveyData.steps.length) {
                    surveyData.steps[targetIndex].questions.forEach(q => {
                        if (q.type === 'radio' && responses[q.id]) {
                            const radio = document.querySelector(`input[name="${q.id}"][value="${responses[q.id]}"]`);
                            if (radio) radio.checked = true;
                        }
                    });
                }

                currentStep = targetIndex;
                updateProgress();

                const fab = document.getElementById('fab-photos');
                if (currentStep > 1 && currentStep < surveyData.steps.length) {
                    fab.classList.remove('hidden');
                    fab.classList.add('flex');
                } else {
                    fab.classList.add('hidden');
                    fab.classList.remove('flex');
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        function updateProgress() {
            let pct = currentStep === -1 ? 5 : ((currentStep + 1) / (surveyData.steps.length + 1)) * 100;
            document.getElementById('progress-bar').style.width = pct + '%';
        }

        async function submitData() {
            const lastStep = surveyData.steps[surveyData.steps.length - 1];
            for (let q of lastStep.questions) {
                if (q.type === 'radio' && !responses[q.id]) {
                    alert('لطفاً به تمامی سوالات پاسخ دهید.');
                    return;
                }
            }
            changeStep(surveyData.steps.length);
            try {
                await fetch("https://engine.dentnet.space/api/appliance_survey/data", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ responses: responses })
                });
            } catch (err) {
                console.error("Submission failed", err);
            }
        }

        function renderSuccess() {
            document.getElementById('survey-container').innerHTML = `
                <div class="step active text-center py-10">
                    <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-primary/20 flex items-center justify-center border border-primary/50">
                        <svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-black text-white mb-4">با موفقیت ثبت شد!</h2>
                    <p class="text-textMuted text-sm leading-relaxed">از زمان و دقتی که برای پیشبرد این پژوهش علمی صرف کردید بی‌نهایت سپاسگزاریم.</p>
                </div>`;
            document.getElementById('progress-bar').style.width = '100%';
        }

        loadSurvey();

        // 1. PERFECT Centered Wheel Zoom (Using exact math)
        document.addEventListener('wheel', (e) => {
            const pz = e.target.closest('pinch-zoom');
            if (!pz) return;

            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.05 : 0.95;
            const newScale = Math.max(1, Math.min(pz.scale * zoomFactor, 5));

            if (newScale <= 1) {
                pz.setTransform({ scale: 1, x: 0, y: 0 });
                return;
            }

            const newX = (pz.offsetWidth - (pz.offsetWidth * newScale)) / 2;
            const newY = (pz.offsetHeight - (pz.offsetHeight * newScale)) / 2;
            pz.setTransform({ scale: newScale, x: newX, y: newY });

        }, { passive: false });

        // 2. Smooth "Snap-Back" Function (Unaffected by outer wrapper)
        function resetZoomSmoothly(pz) {
            if (pz.scale === 1 && pz.x === 0 && pz.y === 0) return;

            // Target the wrapper div that pinch-zoom is actively manipulating
            const innerWrapper = pz.firstElementChild;
            if (innerWrapper) {
                innerWrapper.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                setTimeout(() => {
                    if (innerWrapper) innerWrapper.style.transition = 'none';
                }, 300);
            }
            pz.setTransform({ scale: 1, x: 0, y: 0 });
        }

        // 3. Catch all release events
        ['pointerup', 'pointercancel', 'pointerleave', 'touchend'].forEach(evt => {
            document.addEventListener(evt, () => {
                document.querySelectorAll('pinch-zoom').forEach(pz => resetZoomSmoothly(pz));
            });
        });
    </script>
</body>

</html>

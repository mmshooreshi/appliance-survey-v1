**۱۲. طبق پروتکل جدید تمام موارد زیر امکان ابتلا به اندوکاردیت را بالا میبرد بجز؟**
۱) پیوند قلب
۲) پرولاپس میترال ⭐
۳) دریچه‌های پروتزی قلب
۴) سابقه قبلی اندوکاردیت
🧠 **نکته:** طبق آپدیت‌ها، پرولاپس میترال (MVP) دیگر خطرناک نیست و نیاز به آنتی‌بیوتیک پروفیلاکسی ندارد.

**۱۹. مکانیسم ایجاد اریتروسیتوزیس در کدام یک از شرایط زیر با بقیه متفاوت است؟**
۱) فردی که بطور موقت در ارتفاعات بالای کوه زندگی می کند.
۲) بیمار مبتلا به بیماری مزمن ریه می باشد.
۳) بیماری که پیوند کلیه انجام داده است.
۴) بیمار مبتلا به فشارخون که تحت درمان با هیدروکلروتیازید می باشد. ⭐
🧠 **نکته:** هیدروکلروتیازید دیورتیک است و با کاهش آب بدن باعث غلظت خون کاذب (اریتروسیتوز نسبی) می‌شود، اما بقیه موارد تولید واقعی گلبول قرمز دارند.

**۲۴. خانم ۶۰ ساله‌ای با شکایت از تورم لثه‌ای... در معاینه بالینی تورم سفت... در نمای رادیوگرافی نمای پانچ اوت (punch out) ایجاد کرده است. بیمار مبتلا به دردهای استخوانی نیز می باشد. محتمل‌ترین تشخیص؟**
۱) نوتروپنی اکتسابی
۲) لنفوم هوچکین
۳) میلوم مولتی پل ⭐
۴) پلی سایتمی ورا
🧠 **نکته:** ترکیب نمای پانچ‌اوت (سوراخ‌سوراخ) در رادیوگرافی و درد استخوانی، علامت کلاسیک میلوم مولتی‌پل است.

**۲۹. در بیماری که طی دو ماه گذشته تحت درمان با آنتی بیوتیک بوده است، به دلیل کمبود کدام ماده مستعد خونریزی می باشد؟**
۱) ویتامین C
۲) ویتامین K ⭐
۳) کلسیم
۴) آهن
🧠 **نکته:** مصرف طولانی‌مدت آنتی‌بیوتیک، باکتری‌های مفید روده (تولیدکننده ویتامین K برای انعقاد خون) را از بین برده و فرد را مستعد خونریزی می‌کند.

**۲۷. در مورد فعالیت پلاکتی در تشکیل لخته کدام گزینه صحیح نمی‌باشد؟**
۱) در مدل ملکولی کمپلکس تیناز و پروترومبیناز بر روی پلاکت فعال شده تشکیل می شوند.
۲) ترشح ترومبوکسان از پلاکتها منجر به چسبیدن پلاکتها به کلاژن ساب اندوتلیال می شود. ⭐
۳) پلاکتها از طریق فاکتور ون ویلبراند به بافتهای ساب اندوتلیال آسیب دیده متصل می شوند.
۴) آدنوزین دی فسفات از سلولهای اندوتلیال آسیب دیده و پلاکتها ترشح میشود.
🧠 **نکته:** ترومبوکسان باعث تجمع (Aggregation) پلاکتی می‌شود، اما چسبیدن اولیه به کلاژن (Adhesion) وظیفه فاکتور فون‌ویلبراند است.

**۳۱. در بیمار مبتلا به اختلالات پلاکتی خفیف، اولین اقدام در کنترل خونریزی چیست؟**
۱) کلاژن میکرو فیبریلر
۲) فشار گاز استریل به ناحیه ⭐
۳) استفاده از ترومبین
۴) تزریق مداوم پلاکت
🧠 **نکته:** برای کنترل هر خونریزی اولیه و خفیف، ساده‌ترین و سریع‌ترین کار اِعمال فشار مستقیم است.

**۲۸. در کدام یک از شرایط زیر فرد مستعد خونریزی می باشد؟**
۱) افزایش فعالیت پروترومبین
۲) افزایش فعال کننده پلاسمینوژن بافتی ⭐
۳) کاهش محصولات تجزیه فیبرین
۴) کاهش فعالیت پلاسمین
🧠 **نکته:** فعال‌کننده پلاسمینوژن بافتی (tPA) لخته‌های فیبرینی را حل می‌کند؛ افزایش فعالیت آن باعث از بین رفتن لخته‌ها و خونریزی می‌شود.

**۱. در کدام یک از شرایط زیر افزایش واقعی در توده گلبول‌های قرمز خون دیده نمی‌شود؟**
۱) موتاسیون گیرنده ژن اریتروپوئتین
۲) هیپوکسی ناشی از سیگار
۳) سوختگی شدید ⭐
۴) بعد از پیوند کلیه
🧠 **نکته:** در سوختگی شدید، مایع پلاسما از دست می‌رود که باعث تراکم و افزایش کاذب گلبول‌ها (اریتروسیتوز نسبی) می‌شود، نه تولید واقعی آن‌ها.

**۲. در نتایج آزمایش خون بیمار مبتلا به سرطان، فریتین و hepcidin سرم بالاتر از رنج نرمال بوده و سایر موارد پایین قرار داشتند. کدام مورد در تفسیر آزمایش محتمل تر است؟**
۱) آنمی فقرآهن
۲) آنمی مگالوبلاستیک
۳) آنمی آپلاستیک
۴) آنمی ناشی از التهاب (Anemia of Chronic Disease / Inflammation) ⭐
🧠 **نکته:** در التهاب و بیماری‌های مزمن، هپسیدین بالا رفته و آهن را در سلول‌ها (فریتین بالا) قفل می‌کند؛ بنابراین آهن به مغز استخوان نمی‌رسد و آنمی ایجاد می‌شود.

**۳. بیماری با شکایت از زخمی در ناحیه لثه قدام فک پایین مراجعه کرده که در حال مصرف داروهای آنتی تیروئید می‌باشد... زخمی با غشاء ضخیم و فاقد هاله التهابی مشاهده می‌شود... محتمل ترین تشخیص؟**
۱) نوتروپنی ناشی از دارو (Agranulocytosis) ⭐
۲) آفت ناشی از آنمی
۳) کمبود ویتامین C
۴) آنمی سیکل سل
🧠 **نکته:** داروهای ضد تیروئید باعث نوتروپنی می‌شوند. فقدان هاله التهابی به دلیل نبود نوتروفیل‌ها برای ایجاد واکنش التهابی دور زخم است.

**۴. بیماری با تب و بیحالی و تظاهرات متعدد دهانی مراجعه کرده است. کدام یک از تظاهرات زیر به نفع تشخیص لوسمی نمی باشد؟**
۱) زخم تخریب کننده بافت
۲) خونریزی از لثه
۳) محو شدن ژنرالیزه لامینا دورا ⭐
۴) تورم ژنرالیزه یا لوکالیزه لثه
🧠 **نکته:** زخم، تورم و خونریزی لثه از علائم کلاسیک لوسمی هستند، اما محو شدن ژنرالیزه لامینا دورا نشانه اختلالات متابولیک/استخوانی (مثل هایپرپاراتیروئیدیسم) است.

**۵. مکانیسم ایجاد اریتروسیتوزیس در کدام یک از شرایط زیر با بقیه متفاوت است؟**
۱) بیمار مبتلا به بیماری مزمن ریه می باشد.
۲) بیماری که پیوند کلیه انجام داده است.
۳) فردی که بطور موقت در ارتفاعات بالای کوه زندگی می کند.
۴) بیمار مبتلا به فشارخون که تحت درمان با هیدروکلروتیازید می باشد. ⭐
🧠 **نکته:** هیدروکلروتیازید دارویی دیورتیک است که آب بدن را کم کرده و باعث اریتروسیتوز نسبی (کاذب) می‌شود، برعکس بقیه موارد که تولید واقعی گلبول دارند.

**۶. در آنمی فقر آهن کدام یک از تستهای آزمایشگاهی بالاتر از رنج نرمال می باشد؟**
۱) Ferritin
۲) TIBC (Total Iron Binding Capacity) ⭐
۳) SI (Serum Iron)
۴) MCV (Mean Corpuscular Volume)
🧠 **نکته:** در فقر آهن، ظرفیت اتصال پروتئین‌های ناقل (TIBC) برای جذب حداکثری آهن افزایش می‌یابد، در حالی که فریتین، آهن سرم و MCV افت می‌کنند.

**۷. در بیماری که با تشخیص آنمی مگالوبلاستیک مراجعه کرده است کدام گزینه صحیح نمی باشد؟**
۱) در آزمایش بیمار MCV و MCH کمتر از رنج نرمال مشاهده می شود. ⭐
۲) علایم اختلال حس در نواحی مختلف دهان میتواند مشاهده شود.
۳) در تاریخچه پزشکی می تواند سابقه جراحی معده مطرح باشد که منجر به آنمی شده است.
۴) تزریق آمپول ویتامین B12 بصورت هفته ای می تواند موثر باشد.
🧠 **نکته:** آنمی مگالوبلاستیک از نوع ماکروسیتیک است، بنابراین گلبول‌ها بزرگ شده و شاخص MCV بالاتر از نرمال می‌رود، نه کمتر.

**۸. شایعترین علت پرفشاری ثانویه کدام است؟**
۱) بیماریهای پارانشیم کلیه ⭐
۲) اختلالات آدرنال
۳) اختلالات هیپوفیزی
۴) نارسایی کبدی
🧠 **نکته:** کلیه از طریق سیستم رنین-آنژیوتانسین تنظیم‌کننده اصلی فشار خون است و آسیب به آن شایع‌ترین عامل فشار خون ثانویه محسوب می‌شود.

**۹. تمام موارد زیر تظاهر ناشی از آمبولی در اندوکاردیت هست به جز؟**
۱) گره های اسلر
۲) ضایعات janeway
۳) زخمهای ناحیه قرنیه ⭐
۴) ماکولهای کوچک و بزرگ کف دست و پا
🧠 **نکته:** تظاهرات آمبولی اندوکاردیت معمولاً در اندام‌ها (گره‌های اسلر، ضایعات جِین‌وی و ماکول‌های کف دست و پا) دیده می‌شوند و ارتباطی با قرنیه ندارند.

**۱۰. كدام عبارت در مورد history of present illness صحیح است؟**
۱) شامل اطلاعاتی در مورد تاریخچه خانوادگی بیمار است
۲) شرح و تاریخچه ای بر chief complaint بیمار است ⭐
۳) باید حداکثر دو جمله باشد
۴) با سوالات close ended شروع میشود
🧠 **نکته:** تاریخچه بیماری فعلی (HPI) در واقع داستانِ تشریحی و کاملِ شکایت اصلی (Chief Complaint) بیمار است و با سوالات باز شروع می‌شود.

**۱۱. طبق پروتکل جدید تمام موارد زیر امکان ابتلا به اندوکاردیت را بالا میبرد بجز؟**
۱) پرولاپس میترال ⭐
۲) دریچه های پروتزی قلب
۳) پیوند قلب (که دچار عارضه دریچه‌ای شده)
۴) سابقه قبلی اندوکاردیت
🧠 **نکته:** طبق پروتکل‌های جدید، پرولاپس میترال (MVP) دیگر جزو گروه‌های پرخطر محسوب نشده و نیازی به دریافت آنتی‌بیوتیک پیشگیرانه ندارد.

**۱۲. کدامیک جزو معیارهای اصلی تشخیص اندوکاردیت نمی باشد؟**
۱) شواهد اکوکاردیوگرافی
۲) الکتروکاردیوگرام مثبت
۳) کشت خون مثبت
۴) تب ⭐
🧠 **نکته:** بر اساس معیارهای Duke، کشت خون و اکوکاردیوگرافی مثبت از معیارهای اصلی (Major) هستند، اما تب یک نشانه عمومی و معیار فرعی (Minor) است.

**۹. تمام موارد زیر تظاهر ناشی از آمبولی در اندوکاردیت هست به جز؟**
۱) گره های اسلر
۲) ماکولهای کوچک و بزرگ کف دست و پا
۳) ضایعات janeway
۴) زخمهای ناحیه قرنیه ⭐
🧠 **نکته:** تظاهرات آمبولی اندوکاردیت معمولاً در اندام‌ها (گره‌های اسلر، ضایعات جِین‌وی) و چشم (نقاط راث در شبکیه) دیده می‌شوند و ارتباطی با ایجاد زخم در قرنیه ندارند.

**۱۲. طبق پروتکل جدید تمام موارد زیر امکان ابتلا به اندوکاردیت را بالا میبرد بجز؟**
۱) پیوند قلب
۲) پرولاپس میترال ⭐
۳) دریچه های پروتزی قلب
۴) سابقه قبلی اندوکاردیت
🧠 **نکته:** طبق پروتکل‌های جدید، پرولاپس دریچه میترال (MVP) دیگر در گروه پرخطر قرار ندارد و نیازی به دریافت آنتی‌بیوتیک پروفیلاکسی پیش از مداخلات دندانپزشکی ندارد.

**۱۳. شایعترین علت پرفشاری ثانویه کدام است؟**
۱) بیماریهای پارانشیم کلیه ⭐
۲) اختلالات آدرنال
۳) اختلالات هیپوفیزی
۴) نارسایی کبدی
🧠 **نکته:** کلیه نقش اصلی را در تنظیم فشار خون (سیستم رنین-آنژیوتانسین) دارد، بنابراین بیماری‌های پارانشیم کلیه شایع‌ترین عامل ایجاد فشار خون ثانویه هستند.

**۱۷. افزایش حجم لثه ناشی از مصرف کدام داروی فشار خون میباشد؟**
۱) دیلتیازم ⭐
۲) کاپتوپریل
۳) هیدرالازین
۴) انالاپریل
🧠 **نکته:** دیلتیازم یک مسدودکننده کانال کلسیم (CCB) است. از عوارض جانبی معروف این دسته دارویی (مثل نیفدیپین و دیلتیازم)، ایجاد هایپرپلازی و افزایش حجم لثه است.

**۲۷. در مورد فعالیت پلاکتی در تشکیل لخته کدام گزینه صحیح نمی‌باشد؟**
۱) در مدل ملکولی کمپلکس تیناز و پروترومبیناز بر روی پلاکت فعال شده تشکیل می شوند.
۲) ترشح ترومبوکسان از پلاکتها منجر به چسبیدن پلاکتها به کلاژن ساب اندوتلیال می شود. ⭐
۳) پلاکتها از طریق فاکتور ون ویلبراند به بافتهای ساب اندوتلیال آسیب دیده متصل می شوند.
۴) آدنوزین دی فسفات از سلولهای اندوتلیال آسیب دیده و پلاکتها ترشح میشود.
🧠 **نکته:** ترومبوکسان باعث تجمع (Aggregation) پلاکتی می‌شود، اما چسبیدن اولیه به کلاژن (Adhesion) وظیفه فاکتور فون‌ویلبراند است.

**۲۹. در بیماری که در طی دو ماه گذشته تحت درمان با آنتی بیوتیک بوده است، به دلیل کمبود کدام ماده مستعد خونریزی می باشد؟**
۱) ویتامین C
۲) ویتامین K ⭐
۳) کلسیم
۴) آهن
🧠 **نکته:** مصرف طولانی‌مدت آنتی‌بیوتیک، باکتری‌های مفید روده (تولیدکننده ویتامین K برای انعقاد خون) را از بین برده و فرد را مستعد خونریزی می‌کند.

**۱۲. طبق پروتکل جدید تمام موارد زیر امکان ابتلا به اندوکاردیت را بالا می برد بجز:**
۱) سابقه قبلی اندوکاردیت
۲) پیوند قلب
۳) دریچه های پروتزی قلب
۴) پرولاپس میترال ⭐
🧠 **نکته (تحلیل تله تستی):** طبق راهنمای جدید، **پرولاپس میترال (MVP)** کاملاً از لیست پرخطر خارج شده و دیگر نیازی به پروفیلاکسی آنتی‌بیوتیکی ندارد. (پیوند قلب به تنهایی خطرناک نیست مگر اینکه با عارضه دریچه‌ای همراه باشد، اما در تست‌های بورد، MVP همیشه جواب اصلی و قطعی برای سوالات استثنا است).

**۲۱. ترومبوپلاستین و ترومبوکسان به ترتیب در کدام فاز هموستاتیک نقش دارند؟**
۱) عروقی - فیبرینولیتیک
۲) انعقادی - پلاکتی ⭐
۳) فیبرینولیتیک - انعقادی
۴) پلاکتی - عروقی
🧠 **نکته:** ترومبوپلاستین (فاکتور بافتی) شروع‌کننده مسیر خارجی آبشار انعقاد است (فاز انعقادی)، در حالی که ترومبوکسان توسط پلاکت‌ها ترشح شده و باعث تجمع پلاکتی می‌شود (فاز پلاکتی).

**۲۲. افزایش ترومبین و پلاسمین در افراد به ترتیب سبب بروز چه خطراتی می شوند؟**
۱) ترومبوز- خونریزی ⭐
۲) ترومبوز- ترومبوز
۳) خونریزی- خونریزی
۴) خونریزی- ترومبوز
🧠 **نکته:** ترومبین فاکتور اصلی تشکیل لخته است (افزایش آن = خطر ترومبوز)، اما پلاسمین پروتئینی است که لخته‌ها را حل و تخریب می‌کند (افزایش آن = خطر خونریزی).

**۳۳. کدامیک از تظاهرات دهانی زیر بهمراه وجود تب جزء علایم مشخصه بالینی (key clinical hallmark) در بیمار مبتلا به نوتروپنی دوره ای می باشد؟**
۱) افزایش حجم لثه
۲) زخم دهانی
۳) خونریزی
۴) لقی دندان ⭐
🧠 **نکته (تحلیل تله تستی):** با وجود اینکه زخم دهانی در نوتروپنی شایع است، اما علامت کلیدی و متمایزکننده (Hallmark) در این کودکان، حمله باکتری‌ها به بافت پریودنتال در زمان افت نوتروفیل‌هاست که منجر به تحلیل شدید استخوان و **لقی دندان‌ها** می‌شود.
    </script>

    <script>
        // State Variables
        let allQuestions = [];
        let activeQuestions = [];
        let currentIndex = 0;
        let score = { correct: 0, totalGraded: 0 };
        let selectedOption = null;
        let gameState = 'intro'; // 'intro', 'quiz', 'result'

        // Parse logic (Executes synchronously and instantly on script load)
        function parseQuestions(rawText) {
            // Updated regex to include Persian digits [۰-۹]
            const blocks = rawText.split(/\*\*(?=[\d۰-۹]+\.)/).filter(b => b.trim() !== '');
            const questionList = [];

            for (let i = 0; i < blocks.length; i++) {
                const lines = blocks[i].split('\n').map(l => l.trim()).filter(l => l !== '');
                if (lines.length < 2) continue;

                // Updated to match Persian digits at the start of the question
                const qText = lines[0].replace(/\*\*/g, "").replace(/^[\d۰-۹]+\.\s+/, "").trim();
                const options = [];
                let correctIndex = -1;

                for (let j = 1; j < lines.length; j++) {
                    // Updated to match Persian digits for options
                    if (/^[\d۰-۹]+\)/.test(lines[j])) {
                        let optText = lines[j].replace(/^[\d۰-۹]+\)\s*/, '').trim();
                        if (optText.includes('⭐') || optText.includes('☑') || optText.includes('✓') || /\bV\b/.test(optText)) {
                            correctIndex = options.length;
                            optText = optText.replace(/⭐.*/, '').replace(/☑.*/, '').replace(/✓.*/, '').replace(/\bV\b.*/, '').trim();
                        }
                        options.push(optText);
                    }
                }
                if (options.length > 0) {
                    questionList.push({ q: qText, options, answer: correctIndex });
                }
            }
            
            const uniqueQuestions = [];
            const seen = new Set();
            for (const item of questionList) {
                if (!seen.has(item.q)) {
                    seen.add(item.q);
                    uniqueQuestions.push(item);
                }
            }
            return uniqueQuestions;
        }
        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            const rawText = document.getElementById('raw-questions-data').textContent;
            allQuestions = parseQuestions(rawText);
            render();
        });

        // App Logic
        function startQuiz(shuffle = false) {
            let qs = [...allQuestions];
            if (shuffle) qs.sort(() => Math.random() - 0.5);
            activeQuestions = qs;
            currentIndex = 0;
            score = { correct: 0, totalGraded: 0 };
            selectedOption = null;
            gameState = 'quiz';
            render();
        }

        function handleOptionClick(idx) {
            if (selectedOption !== null) return; // Prevent multiple clicks
            selectedOption = idx;
            const q = activeQuestions[currentIndex];
            if (q.answer !== -1) {
                score.correct += (idx === q.answer ? 1 : 0);
                score.totalGraded += 1;
            }
            render();
        }

        function nextQuestion() {
            if (currentIndex + 1 < activeQuestions.length) {
                currentIndex++;
                selectedOption = null;
                render();
            } else {
                gameState = 'result';
                render();
            }
        }

        // Rendering Engine
        function render() {
            const root = document.getElementById('root');
            root.innerHTML = ''; // Clear current view

            if (gameState === 'intro') {
                root.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center fade-in">
                        <i data-lucide="graduation-cap" class="w-16 h-16 mx-auto text-blue-600 mb-4"></i>
                        <h1 class="text-3xl font-bold text-slate-800 mb-2">آزمون سیستمیک ۱</h1>
                        <p class="text-slate-500 mb-8">${allQuestions.length} سوال در بانک سوالات موجود است</p>
                        
                        <div class="flex flex-col sm:flex-row gap-4 justify-center">
                            <button onclick="startQuiz(false)" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors flex items-center justify-center gap-2">
                                <i data-lucide="play" class="w-5 h-5"></i>
                                شروع به ترتیب
                            </button>
                            <button onclick="startQuiz(true)" class="px-6 py-3 bg-white border-2 border-slate-200 hover:border-blue-600 hover:text-blue-600 text-slate-700 font-medium rounded-lg transition-colors flex items-center justify-center gap-2">
                                <i data-lucide="shuffle" class="w-5 h-5"></i>
                                شروع تصادفی
                            </button>
                        </div>
                    </div>
                `;
            } 
            else if (gameState === 'quiz') {
                const q = activeQuestions[currentIndex];
                console.log(q, activeQuestions, currentIndex, allQuestions)
                const progress = ((currentIndex) / activeQuestions.length) * 100;
                
                let optionsHtml = '';
                q.options.forEach((opt, idx) => {
                    let btnClass = "w-full text-right p-4 rounded-xl border-2 transition-all mb-3 text-slate-700 font-medium ";
                    let iconHtml = "";

                    if (selectedOption === null) {
                        btnClass += "border-slate-200 hover:border-blue-400 hover:bg-blue-50 cursor-pointer";
                    } else {
                        btnClass += "cursor-default ";
                        if (idx === q.answer) {
                            btnClass += "border-green-500 bg-green-50 text-green-700";
                            iconHtml = `<i data-lucide="check-circle" class="w-5 h-5 text-green-600 mr-auto"></i>`;
                        } else if (idx === selectedOption) {
                            btnClass += "border-red-500 bg-red-50 text-red-700";
                            iconHtml = `<i data-lucide="x-circle" class="w-5 h-5 text-red-600 mr-auto"></i>`;
                        } else {
                            btnClass += "border-slate-200 opacity-50";
                        }
                    }

                    optionsHtml += `
                        <button onclick="handleOptionClick(${idx})" class="${btnClass} flex items-center justify-between">
                            <span><span class="inline-block w-6 text-slate-400 font-bold">${idx + 1})</span> ${opt}</span>
                            ${iconHtml}
                        </button>
                    `;
                });

                root.innerHTML = `
                    <div class="mb-6 fade-in">
                        <div class="flex justify-between text-sm text-slate-500 mb-2 font-medium">
                            <span>سوال ${currentIndex + 1} از ${activeQuestions.length}</span>
                            <span dir="ltr">${Math.round(progress)}%</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2.5">
                            <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 fade-in">
                        <h2 class="text-xl md:text-2xl font-bold text-slate-800 mb-8 leading-relaxed">
                            ${q.q}
                        </h2>
                        
                        <div class="space-y-3">
                            ${optionsHtml}
                        </div>

                        ${selectedOption !== null ? `
                            <div class="mt-8 flex justify-end fade-in">
                                <button onclick="nextQuestion()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors flex items-center gap-2">
                                    سوال بعدی
                                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
            else if (gameState === 'result') {
                const percentage = Math.round((score.correct / score.totalGraded) * 100) || 0;
                let colorClass = percentage >= 80 ? "text-green-600" : percentage >= 50 ? "text-yellow-500" : "text-red-500";
                
                root.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center fade-in">
                        <i data-lucide="award" class="w-20 h-20 mx-auto mb-4 ${colorClass}"></i>
                        <h2 class="text-3xl font-bold text-slate-800 mb-2">پایان آزمون</h2>
                        <p class="text-slate-500 mb-8">نتیجه عملکرد شما در این آزمون</p>
                        
                        <div class="text-5xl font-extrabold ${colorClass} mb-8" dir="ltr">
                            ${percentage}%
                        </div>
                        
                        <div class="flex justify-center gap-8 mb-10 text-lg">
                            <div class="text-center">
                                <p class="text-slate-500 text-sm mb-1">پاسخ‌های صحیح</p>
                                <p class="font-bold text-green-600">${score.correct}</p>
                            </div>
                            <div class="text-center border-r border-slate-200 pr-8">
                                <p class="text-slate-500 text-sm mb-1">کل سوالات</p>
                                <p class="font-bold text-slate-700">${activeQuestions.length}</p>
                            </div>
                        </div>

                        <button onclick="gameState='intro'; render();" class="px-8 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition-colors inline-flex items-center gap-2">
                            <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                            بازگشت به صفحه اصلی
                        </button>
                    </div>
                `;
            }

            // Re-initialize icons after DOM generation
            lucide.createIcons();
        }
    </script>
</body>
</html>
